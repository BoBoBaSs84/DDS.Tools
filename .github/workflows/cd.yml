name: Continuous Deployment

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  deploy:
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      SOLUTION: DDS.Tools.slnx
      CONFIGURATION: Release
      RUNTIME: win-x64

    name: Build, Test & Publish
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          tagName="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$tagName" >> $GITHUB_OUTPUT
          echo "Extracted version: $tagName"

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build solution
        run: >
          dotnet build ${{ env.SOLUTION }}
          --configuration ${{ env.CONFIGURATION }}
          --no-restore
          -p:VersionPrefix=${{ steps.version.outputs.VERSION }}
          -p:VersionSuffix=
          -p:FileVersion=${{ steps.version.outputs.VERSION }}

      - name: Run tests
        run: dotnet test ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal --report-trx --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ./test-results/*.trx

      - name: Publish application
        run: >
          dotnet publish src/DDS.Tools/DDS.Tools.csproj
          --configuration ${{ env.CONFIGURATION }}
          --runtime ${{ env.RUNTIME }}
          --self-contained false
          --output ./publish
          -p:VersionPrefix=${{ steps.version.outputs.VERSION }}
          -p:VersionSuffix=
          -p:FileVersion=${{ steps.version.outputs.VERSION }}

      - name: Archive published output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./artifacts -Force | Out-Null
          Compress-Archive -Path ./publish/* -DestinationPath ./artifacts/DDS.Tools.${{ env.RUNTIME }}.${{ steps.version.outputs.VERSION }}.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: DDS.Tools
          path: ./artifacts/DDS.Tools.${{ env.RUNTIME }}.${{ steps.version.outputs.VERSION }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: ./artifacts/DDS.Tools.${{ env.RUNTIME }}.${{ steps.version.outputs.VERSION }}.zip